name: Pruebas del pipeline APS

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache de Natural Earth 10m
        uses: actions/cache@v4
        with:
          path: data/shapefiles
          key: natural-earth-10m-v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools || true
          pip install -r pipeline/requirements.txt

      - name: Ejecutar pruebas geofísicas y de validación
        run: python -m unittest discover -s tests -v

      - name: Verificar interfaces CLI
        run: |
          python pipeline/download_era5.py --help
          python pipeline/download_gfs_forecast.py --help
          python pipeline/download_ncep_reanalysis.py --help
          python pipeline/compute_climatology.py --help
          python pipeline/build_dashboard.py --help
          python pipeline/update_era5_monthly.py --help
          python pipeline/verify_gfs_forecast.py --help
